spring.config.import=optional:file:.env[.properties]

spring.application.name=api-gateway
server.port=${SERVER_PORT:3000}

# Servicio Cliente
spring.cloud.gateway.server.webflux.routes[0].id=servicio-cliente
spring.cloud.gateway.server.webflux.routes[0].uri=${CLIENTE_SERVICE_URL:http://servicio-cliente:3001}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/clientes/**

#Servicio Prodcuto
spring.cloud.gateway.server.webflux.routes[1].id=servicio-producto
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCTO_SERVICE_URL:http://servicio-producto:3002}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/productos/**

#Servicio Factura
spring.cloud.gateway.server.webflux.routes[2].id=servicio-factura
spring.cloud.gateway.server.webflux.routes[2].uri=${FACTURA_SERVICE_URL:http://servicio-factura:3003}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/facturas/**